; PlatformIO Project Configuration
; MSP430FR2433 + ST7735 96x54 IPS LCD
;
; Pin mapping (per schematic):
;   P1.4 = MOSI  (UCA0SIMO)   hardware SPI
;   P1.6 = SCLK  (UCA0CLK)    hardware SPI
;   P1.7 = CS    (GPIO output, manual)
;   P3.2 = RESET (GPIO output)
;   P2.3 = DC    (GPIO output)
;   P1.1 = LED-A (backlight enable)

[env:lpmsp430fr2433]
platform = timsp430
board = lpmsp430fr2433
framework = arduino
upload_protocol = custom
upload_command = ${platformio.packages_dir}/tool-dslite/DebugServer/bin/DSLite flash --config=${PROJECT_DIR}/msp430fr2433.ccxml $SOURCE
monitor_speed = 9600

build_flags =
    -Wall
    -Os
